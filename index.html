<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WebRTC Test</title>
    <style>
        video {
            width: 45%;
            margin: 2%;
        }

        #videos {
            display: flex;
            justify-content: center;
        }

        #controls {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>WebRTC Test Client</h1>

    <div id="controls">
        <button id="cameraBtn">Use Camera</button>
        <button id="screenBtn">Share Screen</button>
        <div style="margin-left: 20px;">
            <label for="audioControl">
                <input type="checkbox" id="audioControl" checked> Enable Audio
            </label>
        </div>
    </div>

    <div id="videos" style="display: flex; justify-content: center; flex-direction: column;">
        <video id="localVideo" style="width: 100%; margin: 2%;" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const wsUrl = 'ws://localhost:9912/ws';

        let localStream = null;
        let remoteStream = null;
        let pc = null;
        let ws = null;
        let currentSource = 'camera';
        let audioEnabled = true;

        // ICE servers configuration
        const configuration = {
            sdpSemantics: 'unified-plan',
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        // HTML elements
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const cameraBtn = document.getElementById('cameraBtn');
        const screenBtn = document.getElementById('screenBtn');
        const audioControl = document.getElementById('audioControl');

        async function init() {
            try {
                await startCamera();

                // Create RTCPeerConnection
                pc = new RTCPeerConnection(configuration);

                // Add transceivers for both audio and video
                pc.addTransceiver('video', { direction: 'sendrecv' });
                pc.addTransceiver('audio', { direction: 'sendrecv' });

                // Add local tracks to peer connection
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // Set up event handlers for the peer connection
                pc.onicecandidate = handleIceCandidate;
                pc.ontrack = handleTrack;
                pc.onconnectionstatechange = handleConnectionStateChange;

                // Create WebSocket connection
                ws = new WebSocket(wsUrl);

                // WebSocket event handlers
                ws.onopen = handleWsOpen;
                ws.onmessage = handleWsMessage;
                ws.onerror = handleWsError;
                ws.onclose = handleWsClose;

            } catch (error) {
                console.error('Error accessing media devices.', error);
            }
        }

        async function startCamera() {
            try {
                // Stop any existing tracks
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                // Get user media (camera and microphone)
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: audioEnabled
                });
                localVideo.srcObject = localStream;
                currentSource = 'camera';
                updateButtonState();

                // If peer connection exists, replace tracks
                replaceTracksInPeerConnection();
            } catch (error) {
                console.error('Error accessing camera:', error);
            }
        }

        async function startScreenShare() {
            try {
                // Stop any existing tracks
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                // Get screen sharing stream
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true
                });

                // If audio is enabled, we need to get audio separately from getUserMedia
                // since getDisplayMedia may not include audio on all browsers
                if (audioEnabled) {
                    try {
                        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        // Combine the screen video track with the audio track
                        localStream = new MediaStream([
                            ...screenStream.getVideoTracks(),
                            ...audioStream.getAudioTracks()
                        ]);
                    } catch (e) {
                        console.warn('Could not get audio track:', e);
                        localStream = screenStream;
                    }
                } else {
                    localStream = screenStream;
                }

                // Add handler for when user stops sharing
                screenStream.getVideoTracks()[0].addEventListener('ended', () => {
                    console.log('Screen sharing ended by user');
                    startCamera();
                });

                localVideo.srcObject = localStream;
                currentSource = 'screen';
                updateButtonState();

                // If peer connection exists, replace tracks
                replaceTracksInPeerConnection();
            } catch (error) {
                console.error('Error starting screen share:', error);
                // Fallback to camera if screen sharing fails
                startCamera();
            }
        }

        function replaceTracksInPeerConnection() {
            if (!pc) return;

            const senders = pc.getSenders();

            // First, handle video and audio separately
            const videoTrack = localStream.getVideoTracks()[0];
            const audioTrack = localStream.getAudioTracks()[0];

            if (videoTrack) {
                const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                if (videoSender) {
                    videoSender.replaceTrack(videoTrack).catch(e =>
                        console.error('Error replacing video track:', e));
                } else {
                    pc.addTrack(videoTrack, localStream);
                }
            }

            if (audioTrack) {
                const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                if (audioSender) {
                    audioSender.replaceTrack(audioTrack).catch(e =>
                        console.error('Error replacing audio track:', e));
                } else {
                    pc.addTrack(audioTrack, localStream);
                }
            }
        }

        function updateButtonState() {
            cameraBtn.disabled = currentSource === 'camera';
            screenBtn.disabled = currentSource === 'screen';
        }

        // Toggle audio
        audioControl.addEventListener('change', function () {
            audioEnabled = this.checked;

            // If we have an existing stream
            if (localStream) {
                // Toggle existing audio tracks
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = audioEnabled;
                });

                // If there are no audio tracks and we want to enable audio, restart with audio
                if (audioEnabled && localStream.getAudioTracks().length === 0) {
                    if (currentSource === 'camera') {
                        startCamera();
                    } else {
                        startScreenShare();
                    }
                }
            }
        });

        // Handle ICE candidates from the peer connection
        function handleIceCandidate(event) {
            if (event.candidate) {
                ws.send(JSON.stringify({
                    type: 'candidate',
                    candidate: {
                        candidate: event.candidate.candidate,
                        sdpMid: event.candidate.sdpMid,
                        sdpMLineIndex: event.candidate.sdpMLineIndex
                    }
                }));
            }
        }

        // Handle tracks from the remote peer
        function handleTrack(event) {
            console.log('Received remote track:', event.track.kind);

            // Make sure we create remote stream if it doesn't exist
            if (!remoteStream) {
                remoteStream = new MediaStream();
                remoteVideo.srcObject = remoteStream;
            }

            // Add this track to our remote stream
            remoteStream.addTrack(event.track);
        }

        // Handle connection state changes
        function handleConnectionStateChange() {
            console.log('Connection state change:', pc.connectionState);
            if (pc.connectionState === 'failed' || pc.connectionState === 'closed' || pc.connectionState === 'disconnected') {
                console.log('Connection closed.');
                ws.close();
            }
        }

        // Handle WebSocket open event
        function handleWsOpen() {
            console.log('WebSocket connection established.');

            // Create an offer and send it to the server
            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .then(() => {
                    ws.send(JSON.stringify({
                        type: 'offer',
                        sdp: pc.localDescription.sdp
                    }));
                })
                .catch(error => console.error('Error creating offer:', error));
        }

        // Handle messages received from the server
        function handleWsMessage(event) {
            const message = JSON.parse(event.data);

            switch (message.type) {
                case 'answer':
                    // Set remote description
                    pc.setRemoteDescription(message)
                        .then(() => console.log('Remote description set.'))
                        .catch(error => console.error('Error setting remote description:', error));
                    break;

                case 'candidate':
                    // Add ICE candidate
                    const candidate = new RTCIceCandidate({
                        sdpMLineIndex: message.candidate.sdpMLineIndex,
                        sdpMid: message.candidate.sdpMid,
                        candidate: message.candidate.candidate
                    });
                    pc.addIceCandidate(candidate)
                        .then(() => console.log('ICE candidate added.'))
                        .catch(error => console.error('Error adding ICE candidate:', error));
                    break;

                default:
                    console.log('Unknown message type:', message.type);
                    break;
            }
        }

        // Handle WebSocket error event
        function handleWsError(error) {
            console.error('WebSocket error:', error);
        }

        // Handle WebSocket close event
        function handleWsClose() {
            console.log('WebSocket connection closed.');
        }

        // Initialize the application
        window.onload = init;

        // Add button event listeners
        cameraBtn.addEventListener('click', startCamera);
        screenBtn.addEventListener('click', startScreenShare);
    </script>

</body>

</html>
